ss="flex flex-col relative w-full pt-safe pb-safe min-h-screen bg-surface"><div class="flex flex-col w-full relative justify-between px-margin py-space-xl overflow-hidden" style="min-height: calc(100vh - 4rem);">

<img alt="Metro Mumbai Logo" class="w-[88px] h-[88px] object-contain drop-shadow-sm select-none" src="https://lh3.googleusercontent.com/aida/AEtjO1X6ivMDDeA8k6v0imKDlgy6GNGjG3UoT6dhqZMi3xp5Y90h7iZTYd_WN0qDWXknl5wZd7GNqzMWPrjSXpkfFcHPSj8fdvWWSsyCcksKTMcpPbi4dxYSUScTqzilaRDN5NZkLtL-J7gD3Ewwl0xwAzpcdOaVfSDWMqByUuPPxBkijdldAgba3zs00X0mm1WBD4NzDqVk-AlkKtzffdPbTgIhgK7ffjpa6CyP9E1166aTcQ"/>
</div>

<p class="font-body-md text-body-md text-secondary mt-1.5 tracking-wide">

<div class="flex items-center justify-center flex-wrap gap-2">

<!-- Line 2A & 2B: Yellow -->

</div>
<!-- Line 3: Aqua -->
<div class="inline-flex items-center gap-1.5 px-2.5 py-1 rounded-full bg-surface-container-low">
<span class="w-2.5 h-2.5 rounded-full bg-[#06B6D4]"></span>
<span class="font-label-sm text-label-sm text-on-surface">Aqua 3</span>
</div>
<!-- Line 7: Red -->
<div class="inline-flex items-center gap-1.5 px-2.5 py-1 rounded-full bg-surface-container-low">

<span class="font-label-sm text-label-sm text-on-surface">Line 7</span>
</div>
</div>
</div>
</div>
<!-- Bottom: Actions & verification footer -->
<div class="relative z-10 flex flex-col items-center w-full gap-4 pb-space-sm">

<div class="flex items-center gap-3 px-4 py-2 rounded-full bg-surface-container-lowest shadow-sm text-secondary">
<div class="relative flex items-center justify-center w-4 h-4">
<span class="animate-ping absolute inline-flex h-full w-full rounded-full bg-primary-container opacity-40"></span>

      </p>
</div>
</div>
</div>
<script>
  (function() {
    const btn = document.getElementById('getStartedBtn');
    if (!btn) return;
    btn.addEventListener('click', function() {
      btn.classList.add('opacity-90', 'scale-[0.99]');
      setTimeout(() => {
        btn.classList.remove('opacity-90', 'scale-[0.99]');
      }, 150);
    });
  })();
